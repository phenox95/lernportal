<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<link rel="icon" href="../../../../../assets/favicon/favicon.svg" type="image/svg+xml">
<link rel="icon" href="../../../../../assets/favicon/favicon.ico" sizes="48x48">
<link rel="apple-touch-icon" href="../../../../../assets/favicon/apple-touch-icon.png">
<title>Rollenkarte – Mini-COP31</title>
<style>
@font-face{font-family:Andika;src:url(../../../../../assets/fonts/andika-regular.woff2) format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:Andika;src:url(../../../../../assets/fonts/andika-bold.woff2) format('woff2');font-weight:700;font-display:swap}
:root{--dk:#7A3B42;--g:#8C4350;--mint:#F5E9EB;--y:#F4B400;--ink:#2A1B1E;--grey:#5b4a4d}
*{box-sizing:border-box}
body{margin:0;background:#fff;color:var(--ink);font-family:Andika,Verdana,sans-serif;font-size:20px;line-height:1.5;text-align:left}
header{background:var(--dk);color:#fff;padding:18px 16px}
header p{margin:0;font-size:16px;color:#F0DADD}
header h1{margin:2px 0 0;font-size:30px;line-height:1.2}
main{max-width:42em;margin:0 auto;padding:18px 16px 40px}
.status{display:inline-block;border:2px solid var(--ink);border-radius:999px;padding:2px 12px;font-size:16px;font-weight:700;margin-bottom:10px}
.auftrag{background:var(--dk);color:#fff;border-radius:14px;padding:14px 16px;margin:0 0 12px;font-size:21px}
.auftrag b{display:block;font-size:16px;color:#F0DADD;margin-bottom:2px}
.pos{background:var(--mint);border-radius:14px;padding:14px 16px;margin:0 0 12px}
h2{font-size:21px;color:var(--g);margin:26px 0 8px}
ul{margin:0;padding-left:1.2em}li{margin-bottom:10px}
table{width:100%;border-collapse:collapse;font-size:18px;margin-bottom:12px}
th,td{border:2px solid var(--g);padding:6px 10px;vertical-align:top;text-align:left}th{background:var(--mint)}
td.w{font-weight:700}td.n{font-weight:700;text-decoration:underline}
.info{border:3px solid var(--g);border-radius:14px;padding:12px 16px;margin:0 0 14px}
.info h3{margin:0 0 6px;font-size:20px}
.info ol{list-style:none;margin:0;padding:0}.info li{display:grid;grid-template-columns:28px 1fr;gap:6px;margin:0 0 6px;font-size:19px;line-height:1.45}
.info li i{font-style:normal;font-size:14px;color:var(--grey);padding-top:5px}
.q{font-size:15px;color:var(--grey);margin:6px 0 0}
.aufg{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:start;margin:0 0 12px;font-size:19px}
.aufg b.nr{background:var(--g);color:#fff;border-radius:8px;padding:0 8px}.aufg .lv{font-size:14px;font-weight:700;border:2px solid var(--grey);border-radius:8px;padding:0 7px}
.opt{font-size:15px;color:var(--grey)}
.tisch{font-size:17px;columns:1;margin:0;padding-left:1.1em}
.sb{background:var(--mint);border-radius:14px;padding:10px 16px;font-size:18px}
.vote{margin-top:6px}.vote h3{margin:14px 0 4px;font-size:19px}
.vz{display:grid;grid-template-columns:1fr repeat(3,minmax(64px,auto));gap:6px;align-items:center;margin-bottom:6px;font-size:18px}
.vz label{display:flex;align-items:center;justify-content:center;min-height:52px;border:3px solid var(--g);border-radius:12px;font-weight:700;cursor:pointer;padding:0 6px}
.vz input{position:absolute;opacity:0;pointer-events:none}.vz label:has(input:checked){background:var(--g);color:#fff}
.vz label:has(input:focus-visible){outline:3px solid var(--y);outline-offset:2px}
textarea{width:100%;font:inherit;font-size:18px;padding:10px;border:3px solid var(--g);border-radius:12px;min-height:84px}
button{font:inherit;min-height:56px;padding:0 20px;border-radius:12px;border:0;background:var(--g);color:#fff;font-weight:700;margin-top:14px}
button.z{background:#fff;color:var(--ink);border:3px solid var(--g)}
.qrbox{background:#fff;border:4px solid var(--ink);border-radius:14px;padding:14px;margin:16px auto 0;width:min(86vw,340px)}.qrbox svg{display:block;width:100%;height:auto}
.hinweis{font-size:16px;color:var(--grey);margin-top:12px}
nav{display:flex;gap:10px;flex-wrap:wrap;margin-top:28px}
nav a{display:inline-flex;align-items:center;justify-content:center;min-width:56px;min-height:56px;border-radius:12px;background:var(--g);color:#fff;font-weight:700;text-decoration:none;font-size:22px}
nav a[aria-current="page"]{background:var(--y);color:var(--ink)}
.fehler{padding:24px 16px}
</style>
</head>
<body>
<header><p>Mini-COP31: Wir verhandeln</p><h1 id="titel">Rollenkarte</h1></header>
<main id="inhalt"><p class="fehler">Die Rollenkarte wird geladen. Dafür braucht die Seite JavaScript.</p></main>
<script src="../../../../../assets/js/qrcode.js"></script>
<script src="../assets/rollen.js"></script>
<script>
(function(){
  var m=/[?&]r=([1-6])\b/.exec(location.search),k=m?+m[1]:0,R=window.COP_ROLLEN,r=R[k],main=document.getElementById('inhalt');
  if(!r){main.innerHTML='<p class="fehler">Diese Rollenkarte gibt es nicht. Scanne den QR-Code auf deiner Karte noch einmal.</p>';return;}
  function md(t){return t.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>')}
  document.title=r.n+' – Mini-COP31';
  document.getElementById('titel').textContent=k+' '+r.n;
  var h='<span class="status">'+r.s+'</span>';
  h+='<div class="auftrag"><b>Dein Auftrag</b>'+r.auftrag+'</div><div class="pos"><b>Wer wir sind:</b> '+r.wer+'</div>';
  h+='<h2>'+r.kopf+'</h2><ul>'+r.liste.map(function(x){return '<li>'+x+'</li>'}).join('')+'</ul>';
  if(r.st){
    h+='<h2>Eure Haltung zu den Varianten</h2>';
    [1,2].forEach(function(a){
      h+='<table><caption style="text-align:left;font-weight:700;padding:0 0 4px">'+window.COP_TITEL[a]+'</caption><tr><th>Variante</th><th>Was steht darin?</th><th>Haltung</th></tr>';
      ['A','B','C'].forEach(function(v,i){var c=r.st[a].charAt(i),lab=(r.lab&&r.lab[c])||window.COP_HALTUNG[c]||window.COP_HALTUNG.n;
        h+='<tr><td><b>'+v+'</b></td><td>'+window.COP_VAR[a][v]+'</td><td class="'+(c==='w'?'w':(c==='n'||c==='u')?'n':'')+'">'+lab+'</td></tr>'});
      h+='</table>';
    });
  }
  h+='<h2>Infos zu eurer Rolle</h2><p class="hinweis" style="margin:0 0 10px">Hier stehen Fakten. Die Argumente schreibt ihr selbst.</p>';
  r.infos.forEach(function(f,i){
    h+='<div class="info"><h3>M-R'+(i+1)+' · '+f.t+'</h3><ol>'+f.z.map(function(z,j){return '<li><i>'+((j+1)%5===0?(j+1):'')+'</i><span>'+z+'</span></li>'}).join('')+'</ol><p class="q">Quelle: '+f.q+'</p></div>';
  });
  h+='<h2>Das erarbeitet ihr selbst</h2>';
  r.aufg.forEach(function(a,i){h+='<div class="aufg"><b class="nr">R'+(i+1)+'</b><span>'+md(a.t)+(a.opt?' <span class="opt">(Erweiterung)</span>':'')+'</span><span class="lv">'+a.n+'</span></div>'});
  h+='<p class="hinweis">Schreibe auf das Blatt oder in dein Heft. Das hilft dir bei Aufgabe 1 bis 3 auf dem Arbeitsblatt.</p>';
  h+='<div class="sb"><b>Satzbausteine:</b><br>'+r.sb.join('<br>')+'</div>';
  h+='<h2>Wer sitzt noch am Tisch?</h2><ul class="tisch">'+window.COP_TISCH.map(function(t){return '<li><b>'+t[0]+'</b>: '+t[1]+'</li>'}).join('')+'</ul>';
  if(k<=4){
    h+='<h2>Abstimmung: Ergebnis senden</h2><p class="hinweis" style="margin:0 0 6px">Erst nach der Verhandlung ausfüllen. Ihr stimmt ab, die Lehrkraft scannt euren Code. Ja, Nein oder Enthaltung (Enth.).</p><div class="vote" id="vote">';
    [1,2].forEach(function(a){h+='<h3>'+window.COP_TITEL[a].split(' (')[0]+'</h3>';
      ['A','B','C'].forEach(function(v){var n='v'+a+v;h+='<div class="vz"><span><b>Variante '+v+'</b></span>'+
        ['j:Ja','n:Nein','e:Enth.'].map(function(o){var p=o.split(':');return '<label><input type="radio" name="'+n+'" value="'+p[0]+'">'+p[1]+'</label>'}).join('')+'</div>'})});
    h+='<button type="button" id="mk">QR-Code erzeugen</button></div>';
  } else if(k===5){
    h+='<h2>Kompromiss-Sätze senden</h2><p class="hinweis" style="margin:0 0 6px">Schreibt je einen Satz (höchstens 140 Zeichen). Die Lehrkraft scannt den Code, die Sätze erscheinen auf der Tafel.</p><div class="vote" id="vote">'+
      '<label for="k1"><b>Kompromiss Antrag 1</b></label><textarea id="k1" maxlength="140"></textarea><label for="k2"><b>Kompromiss Antrag 2</b></label><textarea id="k2" maxlength="140"></textarea><button type="button" id="mk">QR-Code erzeugen</button></div>';
  }
  h+='<div id="qrziel"></div><button type="button" id="vl" class="z">Vorlesen lassen</button><nav aria-label="Andere Rollenkarten">';
  for(var i=1;i<=6;i++)h+='<a href="?r='+i+'"'+(i===k?' aria-current="page"':'')+' aria-label="Rolle '+i+': '+R[i].n+'">'+i+'</a>';
  h+='</nav><p class="hinweis">Die Rollen sind vereinfachte Positionen, keine Meinung der Lehrkraft oder der Klasse. Es werden keine Namen gesendet.</p>';
  main.innerHTML=h;
  /* Ergebnis-QR (Rückkanal): Rolle, Abstimmung je Variante (j, n, e) oder Kompromiss-Sätze. Alles steckt im Code, nichts geht ins Internet. */
  var mk=document.getElementById('mk');
  if(mk)mk.onclick=function(){
    var o={t:'cop31',r:k};
    if(k<=4){var miss=0;['1','2'].forEach(function(a){var s='';['A','B','C'].forEach(function(v){var c=document.querySelector('input[name=v'+a+v+']:checked');if(!c)miss++;s+=c?c.value:'-'});o['a'+a]=s});
      if(miss){document.getElementById('qrziel').innerHTML='<p class="hinweis"><b>Es fehlen noch '+miss+' Angaben.</b> Wählt bei jeder Variante Ja, Nein oder Enth.</p>';return}}
    else{o.k=[document.getElementById('k1').value.trim(),document.getElementById('k2').value.trim()];if(!o.k[0]&&!o.k[1]){document.getElementById('qrziel').innerHTML='<p class="hinweis"><b>Schreibt zuerst einen Kompromiss-Satz.</b></p>';return}}
    try{if(window.qrcode.stringToBytesFuncs)window.qrcode.stringToBytes=window.qrcode.stringToBytesFuncs['UTF-8'];
      var q=window.qrcode(0,'M');q.addData(JSON.stringify(o),'Byte');q.make();
      document.getElementById('qrziel').innerHTML='<div class="qrbox" role="img" aria-label="Ergebnis-QR-Code">'+q.createSvgTag({cellSize:6,margin:0,scalable:true})+'</div><p class="hinweis" style="text-align:center">Zeige diesen Code der Lehrkraft. Ändern? Wähle neu und erzeuge den Code noch einmal.</p>';
    }catch(e){document.getElementById('qrziel').innerHTML='<p class="hinweis"><b>Der Text ist zu lang.</b> Kürzt die Sätze.</p>'}
  };
  var b=document.getElementById('vl'),ss=window.speechSynthesis;
  if(!ss){b.style.display='none';return;}
  b.onclick=function(){if(ss.speaking){ss.cancel();return}
    var u=new SpeechSynthesisUtterance(main.innerText.split('Abstimmung: Ergebnis senden')[0].split('Kompromiss-Sätze senden')[0]);u.lang='de-DE';ss.speak(u)};
})();
</script>
</body>
</html>
