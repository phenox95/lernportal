name: Daten aktualisieren
# Holt offene Daten (siehe tools/daten-holen.py) und legt sie als Pull Request ab. Nichts wird ungeprüft veröffentlicht.
# Standard: nur von Hand starten (Actions → Daten aktualisieren → Run workflow).
# Wöchentlich automatisch: die beiden Zeilen unter "schedule" einkommentieren.
on:
  workflow_dispatch:
  # schedule:
  #   - cron: "17 4 * * 1"
permissions:
  contents: write
  pull-requests: write
jobs:
  daten:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/daten-holen.py erdbeben
      - run: python3 tools/check.py
      - uses: peter-evans/create-pull-request@v6
        with:
          branch: daten/aktualisierung
          title: "Daten aktualisiert (Erdbeben)"
          commit-message: "Daten aktualisiert"
          body: "Automatisch von tools/daten-holen.py erzeugt. Quelle und Abrufdatum stehen in der Datei."
