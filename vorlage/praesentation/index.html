<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Vorlage Präsentation</title>
<!-- Beim Kopieren nach biologie/klasse-N/thema/stunde/praesentation/: jeden Pfad "../../" um die Ordnertiefe verlängern
     (link, zwei script, data-root, das Werkzeug-Skript am Ende), siehe README. -->
<link rel="stylesheet" href="../../assets/css/material.css">
<link rel="stylesheet" href="../../assets/css/praesentation.css">
<script src="../../assets/js/prefs.js"></script>
<script src="../../assets/js/material.js" defer></script>
<style>
:root{--fach:#0F6E56;--dunkel:#0B4F3C;--hell:#E8F3EC;--ink:#1A2B24}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{display:flex;flex-direction:column;background:#111;overflow:hidden;font-family:Verdana,Arial,sans-serif;color:var(--ink)}
#buehne{position:relative;flex:1;min-height:0;overflow:hidden}
/* Bühne: feste Größe 1280 × 720, wird per Skript skaliert. Stift, Timer und Lärmampel brauchen genau diese Kennung. */
#stage{position:absolute;left:50%;top:50%;width:1280px;height:720px;transform-origin:center center;background:#fff;overflow:hidden}
.slide{position:absolute;inset:0;display:none;padding:56px 64px 64px;flex-direction:column;gap:20px}
.slide.on{display:flex}
.slide.dunkel{background:var(--dunkel);color:#fff}
h1{margin:0;font-size:46px;line-height:1.15;color:var(--dunkel)}
.slide.dunkel h1{color:#fff}
p{margin:0;font-size:30px;line-height:1.4}
.op{font-weight:700;color:var(--fach)}
.kasten{background:var(--hell);border-radius:16px;padding:20px 26px}
#nav{position:absolute;left:0;right:0;bottom:0;height:6px;background:rgba(0,0,0,.12)}
#nav i{display:block;height:100%;width:0;background:var(--fach);transition:width .2s}
.pf{position:absolute;bottom:14px;width:48px;height:40px;border:0;border-radius:10px;background:rgba(15,110,86,.15);color:var(--fach);font-size:24px;cursor:pointer}
.pf.l{left:16px}.pf.r{right:16px}
#notiz{position:fixed;left:0;right:0;bottom:0;background:#1A2B24;color:#fff;padding:14px 28px;font-size:17px;line-height:1.45;max-height:34vh;overflow:auto;display:none;z-index:2000}
#notiz.an{display:block}
@media print{html,body{overflow:visible;height:auto;background:#fff;display:block}#buehne{position:static;overflow:visible}#stage{position:static;transform:none!important;width:auto;height:auto}.slide{display:flex!important;position:relative;width:1280px;height:720px;page-break-after:always}.pf,#nav,#notiz{display:none}}
</style>
</head>
<body data-root="../../" data-title="Vorlage Präsentation" data-subject="Biologie" data-grade="Klasse 8">
<noscript><p style="padding:1rem;font-size:1rem;background:#fff">Diese Präsentation braucht JavaScript. Bitte aktiviere es im Browser.</p></noscript>
<div id="buehne">
<div id="stage">

<!-- Jede Folie: <section class="slide">. data-min="3" schlägt dem Timer 3 Minuten vor.
     data-notes enthält Lehrkrafthinweise (Taste N). ACHTUNG: Alles im Repository ist öffentlich,
     keine Erwartungshorizonte oder Lösungen für die Lehrkraft in data-notes schreiben. -->

<section class="slide" data-min="3" data-notes="Do Now: Wiederholung der Vorstunde, schriftlich, ohne Erklärung der Lehrkraft.">
  <h1>Do Now</h1>
  <p><span class="op">Erkläre</span> in einem Satz einen Begriff aus der letzten Stunde.</p>
  <div class="kasten"><p>Schreibe in dein Heft. Vorlesen lassen ist erlaubt.</p></div>
</section>

<section class="slide dunkel" data-notes="Impuls stumm zeigen, höchstens 5 Minuten mit Fragenentwicklung. Frage nicht vorgeben.">
  <h1>Impuls</h1>
  <p>Platz für Bild, Karte oder Diagramm.</p>
</section>

<section class="slide" data-min="10" data-notes="Erarbeitung. Jede Aufgabe beginnt mit einem Operator.">
  <h1>Erarbeitung</h1>
  <p><span class="op">Beschreibe</span> die Abbildung in zwei Sätzen.</p>
</section>

<div id="nav"><i></i></div>
<button class="pf l" id="zur" aria-label="zurück">‹</button>
<button class="pf r" id="vor" aria-label="weiter">›</button>
</div>
</div>
<div id="notiz"></div>

<script>
(function(){
  var buehne=document.getElementById('buehne'),stage=document.getElementById('stage'),notiz=document.getElementById('notiz'),balken=document.querySelector('#nav i');
  var slides=[].slice.call(document.querySelectorAll('.slide')),cur=0;
  function fit(){var s=Math.min(buehne.clientWidth/1280,buehne.clientHeight/720);stage.style.transform='translate(-50%,-50%) scale('+s+')'}
  function show(n){
    cur=Math.max(0,Math.min(slides.length-1,n));
    slides.forEach(function(s,i){s.classList.toggle('on',i===cur)});
    balken.style.width=((cur+1)/slides.length*100)+'%';
    notiz.textContent=slides[cur].getAttribute('data-notes')||'';
    try{history.replaceState(null,'','#'+(cur+1))}catch(e){}
  }
  function tippt(t){return t&&(t.isContentEditable||/INPUT|TEXTAREA|SELECT/.test(t.tagName))}
  document.addEventListener('keydown',function(e){
    if(tippt(e.target)||e.ctrlKey||e.metaKey||e.altKey)return;
    if(e.key==='ArrowRight'||e.key==='PageDown'||(e.key===' '&&e.target.tagName!=='BUTTON')){e.preventDefault();show(cur+1)}
    else if(e.key==='ArrowLeft'||e.key==='PageUp'){show(cur-1)}
    else if(e.key==='n'||e.key==='N'){notiz.classList.toggle('an')}
    else if(e.key==='f'||e.key==='F'){try{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()}catch(x){}}
  });
  document.getElementById('vor').onclick=function(){show(cur+1)};
  document.getElementById('zur').onclick=function(){show(cur-1)};
  window.addEventListener('resize',fit);fit();
  var h=parseInt((location.hash||'').replace('#',''),10);show(isNaN(h)?0:h-1);
})();
</script>
<!-- Werkzeuge für alle Präsentationen: Stift (P), Timer (T), Lärmampel (L). Pflicht, am Ende des body. -->
<script src="../../assets/js/praesentation.js" defer></script>
</body>
</html>
